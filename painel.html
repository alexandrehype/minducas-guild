<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minducas — Painel do Jogador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=11">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="nav.js?v=3"></script>
<script src="helpers.js?v=8"></script>
<style>
  .charHead{margin-bottom:22px;}
  .charName{font-family:'Russo One',Georgia,serif; font-weight:400; letter-spacing:0.5px; font-size:24px; color:var(--text); display:flex; align-items:center;}
  .charMeta{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center;}

  .highlights{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:20px;}
  .hCard{background:var(--panel-2); border:1px solid var(--gold-dim); border-radius:4px; padding:18px 12px; text-align:center;}
  .hCard .num{font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:26px; color:var(--gold); font-weight:bold; line-height:1;}
  .hCard .lbl{font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-weight:600; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:6px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(85px,1fr)); gap:8px;}
  .stat{background:var(--panel-2); border:1px solid var(--line); border-radius:3px; padding:10px 6px; text-align:center;}
  .stat .v{font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:16px; color:var(--text); font-weight:bold;}
  .stat .l{font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-weight:600; font-size:8.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-top:3px;}

  /* Modal de edição */
  .modal-overlay{position:fixed; inset:0; background:rgba(8,7,10,.72); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px;}
  .modal-box{background:var(--panel); border:1px solid var(--gold-dim); border-radius:5px; padding:26px; max-width:380px; width:100%;}
  .modal-title{font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); margin-bottom:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; color:var(--muted); margin-bottom:6px;}
  .field input, .field select{width:100%; background:#161318; border:1px solid var(--line); color:var(--text); padding:10px 11px; border-radius:3px; font-size:14px; font-family: Georgia, serif;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}
  .modal-status{font-size:12px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; margin-top:10px; min-height:16px;}
  .modal-status.err{color:var(--red);}
  .modal-status.ok{color:var(--green);}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="wrap" id="app" style="display:none;">
    <header>
      <h1 class="pageTitle">Meu Painel</h1>
      <div class="subtitle" id="welcomeMsg">carregando...</div>
    </header>

    <section id="charSection">
      <h2>Meu Personagem</h2>
      <div id="charContent"></div>
    </section>

    <section id="chartSection">
      <h2>Últimas 5 Pontuações</h2>
      <div class="chartTabs" id="chartTabs">
        <button class="chartTab active" data-metric="pontos">Pontos</button>
        <button class="chartTab" data-metric="abates">Abates</button>
        <button class="chartTab" data-metric="assistencias">Assistências</button>
        <button class="chartTab" data-metric="mortes">Mortes</button>
      </div>
      <div id="scoreChart"></div>
      <div class="chartEmptyNote" style="display:none;">Ainda não há GvGs registradas — gráfico zerado.</div>
    </section>

    <section id="freqSection">
      <h2>Frequência na Guilda</h2>
      <div id="freqContent" class="stats"></div>
    </section>
  </div>
</div>

  <div class="gate" id="gate">
    <p id="gateMsg">Verificando acesso...</p>
  </div>

<script>
  const client = supabase.createClient('https://fqbgvqficprufgpuyjsh.supabase.co', 'sb_publishable_W37jIu813NWTVcokSJnd2g_JbperpeB');

  let currentProfile = null;

  const app = document.getElementById('app');
  const gate = document.getElementById('gate');
  const gateMsg = document.getElementById('gateMsg');

  function renderChar(profile, row){
    document.getElementById('welcomeMsg').textContent = `bem-vindo(a), ${profile.nick}`;

    const g = CLASS_GROUP[profile.classe] || '';
    const r = row || {}; // sem registro no ranking ainda -> tudo zerado

    const abates = r.abates ?? 0;
    const assist = r.assistencias ?? 0;
    const mortes = r.mortes ?? 0;
    const kda = mortes > 0 ? ((abates + assist) / mortes).toFixed(2) : (abates + assist).toFixed(2);

    document.getElementById('charContent').innerHTML = `
      <div class="charHead">
        <div class="charName">${classIcon(profile.classe)}${profile.nick}<span class="aliasInline" id="aliasInline"></span></div>
        <div class="charMeta">
          ${g ? groupTag(g) : ''}
          <span style="color:var(--muted); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:12px;">${profile.classe || 'classe não definida'}</span>
          ${profile.staff ? '<span class="tag staff">Staff</span>' : ''}
          <button class="btn" id="btnEdit" style="margin-left:8px;">Editar</button>
        </div>
      </div>

      <div class="highlights">
        <div class="hCard"><div class="num">${r.media ?? 0}</div><div class="lbl">Média</div></div>
        <div class="hCard"><div class="num">${trendIcon(r.tendencia)}</div><div class="lbl">Tendência</div></div>
        <div class="hCard"><div class="num">${kda}</div><div class="lbl">KDA</div></div>
      </div>

      <div class="stats">
        <div class="stat"><img class="statIcon" src="icones/ranking/finish.png" onerror="this.style.display='none'"><div class="v">${r.marcas ?? 0}</div><div class="l">Marcas</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/castle-tower.png" onerror="this.style.display='none'"><div class="v">${r.ocupacao_s ?? 0}</div><div class="l">Ocup. S</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/castle-tower.png" onerror="this.style.display='none'"><div class="v">${r.ocupacao_a ?? 0}</div><div class="l">Ocup. A</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/castle-tower.png" onerror="this.style.display='none'"><div class="v">${r.ocupacao_b ?? 0}</div><div class="l">Ocup. B</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/monster.png" onerror="this.style.display='none'"><div class="v">${r.monstros ?? 0}</div><div class="l">Monstros</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/boss.png" onerror="this.style.display='none'"><div class="v">${r.chefes ?? 0}</div><div class="l">Chefes</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/kill.png" onerror="this.style.display='none'"><div class="v">${abates}</div><div class="l">Abates</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/assist.png" onerror="this.style.display='none'"><div class="v">${assist}</div><div class="l">Assist.</div></div>
        <div class="stat"><img class="statIcon" src="icones/ranking/death.png" onerror="this.style.display='none'"><div class="v">${mortes}</div><div class="l">Mortes</div></div>
      </div>`;

    const memberSince = profile.created_at
      ? new Date(profile.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' })
      : '—';

    document.getElementById('freqContent').innerHTML = `
      <div class="stat"><div class="v">${memberSince}</div><div class="l">Membro desde</div></div>
      <div class="stat"><div class="v">${r.presencas ?? 0}</div><div class="l">Presenças</div></div>
      <div class="stat"><div class="v">${r.ausencias ?? 0}</div><div class="l">Ausências</div></div>`;

    document.getElementById('btnEdit').addEventListener('click', openEditModal);
  }

  function openEditModal(){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">Editar personagem</div>
        <div class="field">
          <label>Nick</label>
          <input type="text" id="editNick" value="${currentProfile.nick}">
        </div>
        <div class="field">
          <label>Classe</label>
          <select id="editClasse">
            <option value="">Não definida</option>
            ${CLASSES.map(c => `<option value="${c}" ${c===currentProfile.classe?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn" id="editCancel">Cancelar</button>
          <button class="btn primary" id="editSave">Salvar</button>
        </div>
        <div class="modal-status" id="editStatus"></div>
      </div>`;
    document.body.appendChild(overlay);

    const close = () => overlay.remove();
    overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
    document.getElementById('editCancel').addEventListener('click', close);

    document.getElementById('editSave').addEventListener('click', async ()=>{
      const nick = document.getElementById('editNick').value.trim();
      const classe = document.getElementById('editClasse').value;
      const statusEl = document.getElementById('editStatus');

      if(!nick){
        statusEl.className = 'modal-status err';
        statusEl.textContent = 'O nick não pode ficar vazio.';
        return;
      }

      const { error } = await client.from('profiles').update({ nick, classe: classe || null }).eq('id', currentProfile.id);
      if(error){
        statusEl.className = 'modal-status err';
        statusEl.textContent = 'Erro ao salvar: ' + error.message;
        return;
      }

      currentProfile.nick = nick;
      currentProfile.classe = classe || null;
      close();
      loadCharData();
    });
  }

  async function loadCharData(){
    const { data: row } = await client
      .from('ranking')
      .select('*')
      .eq('player_id', currentProfile.id)
      .maybeSingle();
    renderChar(currentProfile, row);
    renderAliases(client, document.getElementById('aliasInline'), currentProfile.id, currentProfile.nick);
    loadScoreChart();
  }

  let chartEntries = [];
  let currentMetric = 'pontos';

  async function loadScoreChart(){
    const { data } = await client
      .from('gvg_session_players')
      .select('pontos, abates, assistencias, mortes, gvg_sessions(gvg_date, label)')
      .eq('player_id', currentProfile.id)
      .limit(200);

    const rows = (data || [])
      .filter(r => r.gvg_sessions?.gvg_date)
      .sort((a, b) => new Date(a.gvg_sessions.gvg_date) - new Date(b.gvg_sessions.gvg_date))
      .slice(-5);

    chartEntries = rows.map(r => ({
      pontos: Math.round(r.pontos ?? 0),
      abates: r.abates ?? 0,
      assistencias: r.assistencias ?? 0,
      mortes: r.mortes ?? 0,
      label: new Date(r.gvg_sessions.gvg_date + 'T00:00:00').toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }),
    }));

    renderScoreChart(document.getElementById('scoreChart'), chartEntries, currentMetric);
  }

  document.getElementById('chartTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chartTab');
    if(!btn) return;
    document.querySelectorAll('.chartTab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMetric = btn.dataset.metric;
    renderScoreChart(document.getElementById('scoreChart'), chartEntries, currentMetric);
  });

  (async ()=>{
    const { data: { session } } = await client.auth.getSession();
    if(!session){
      gateMsg.textContent = 'Você precisa entrar pra acessar essa página.';
      setTimeout(()=>{ window.location.href = 'index.html'; }, 1200);
      return;
    }

    const { data: profile, error: profileError } = await client
      .from('profiles')
      .select('id, nick, classe, approved, staff, removed, created_at')
      .eq('id', session.user.id)
      .single();

    if(profileError || !profile){
      gateMsg.textContent = 'Não consegui carregar seu perfil. Tente entrar de novo.';
      await client.auth.signOut();
      return;
    }

    if(profile.removed){
      gateMsg.textContent = 'Sua conta foi removida da guilda.';
      await client.auth.signOut();
      return;
    }

    if(!profile.approved){
      gateMsg.textContent = 'Seu cadastro ainda está aguardando aprovação da staff.';
      await client.auth.signOut();
      return;
    }

    currentProfile = profile;
    renderTopNav(client, profile, 'painel');
    gate.style.display = 'none';
    app.style.display = 'block';
    loadCharData();
  })();
</script>
</body>
</html>
