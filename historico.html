<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minducas — Histórico de GvGs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="nav.js?v=4"></script>
<script src="helpers.js?v=4"></script>
<style>
  .history-item{border:1px solid var(--line); border-radius:4px; margin-bottom:12px; background:var(--panel); overflow:hidden;}
  .history-item summary{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 18px; margin:0; cursor:pointer; list-style:none;
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; color:var(--text);
  }
  .history-item summary::-webkit-details-marker{display:none;}
  .history-item summary .h-meta{color:var(--muted); font-size:11.5px;}
  .history-total{color:var(--gold); font-weight:700;}
  .history-item .table-scroll{margin:0 18px 18px;}
  table{min-width:950px;}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="wrap" id="app" style="display:none;">
    <header>
      <h1 class="pageTitle">Histórico de GvGs</h1>
      <div class="subtitle">todas as sessões já importadas</div>
    </header>

    <div id="historyList"></div>
    <div class="empty" id="historyEmpty">Nenhuma GvG importada ainda.</div>
    <div class="status" id="historyStatus"></div>
  </div>
</div>

  <div class="gate" id="gate">
    <p id="gateMsg">Verificando acesso...</p>
  </div>

<script>
  const client = supabase.createClient('https://fqbgvqficprufgpuyjsh.supabase.co', 'sb_publishable_W37jIu813NWTVcokSJnd2g_JbperpeB');
  const app = document.getElementById('app');
  const gate = document.getElementById('gate');
  const gateMsg = document.getElementById('gateMsg');

  function renderSessionRows(players){
    return players.map(p => `
      <tr>
        <td>${p.player_id ? `<a href="perfil.html?id=${p.player_id}" class="nickText" style="color:var(--text); text-decoration:none; border-bottom:1px dotted var(--muted);">${p.nick}</a>` : `<span class="nickText">${p.nick}</span>`}${p.staff ? '<span class="staffBadge">Staff</span>' : ''}</td>
        <td>${classIcon(p.classe, 22)}</td>
        <td>${arenaTag(p.arena)}</td>
        <td>${formatTag(p.formato)}</td>
        <td class="num">${p.marcas ?? 0}</td>
        <td class="num">${p.ocupacao_s ?? 0}</td>
        <td class="num">${p.ocupacao_a ?? 0}</td>
        <td class="num">${p.ocupacao_b ?? 0}</td>
        <td class="num">${p.monstros ?? 0}</td>
        <td class="num">${p.chefes ?? 0}</td>
        <td class="num">${p.abates ?? 0}</td>
        <td class="num">${p.assistencias ?? 0}</td>
        <td class="num">${p.mortes ?? 0}</td>
        <td class="num" style="color:var(--gold); font-weight:700;">${Math.round(p.pontos ?? 0)}</td>
      </tr>`).join('');
  }

  async function loadHistory(){
    const { data: sessions, error } = await client
      .from('gvg_sessions')
      .select('id, label, gvg_date')
      .order('gvg_date', { ascending: false });

    if(error){
      document.getElementById('historyStatus').className = 'status err';
      document.getElementById('historyStatus').textContent = 'Erro ao carregar histórico: ' + error.message;
      return;
    }

    document.getElementById('historyEmpty').style.display = (sessions && sessions.length) ? 'none' : 'block';
    if(!sessions || !sessions.length) return;

    const { data: allPlayers, error: playersError } = await client
      .from('gvg_session_players')
      .select('*');

    if(playersError){
      document.getElementById('historyStatus').className = 'status err';
      document.getElementById('historyStatus').textContent = 'Erro ao carregar jogadores das sessões: ' + playersError.message;
      return;
    }

    document.getElementById('historyList').innerHTML = sessions.map(sess => {
      const players = (allPlayers || []).filter(p => p.session_id === sess.id).sort((a,b) => (b.pontos||0) - (a.pontos||0));
      const total = players.reduce((s,p) => s + (Number(p.pontos)||0), 0);
      const dt = sess.gvg_date ? new Date(sess.gvg_date + 'T00:00:00').toLocaleDateString('pt-BR') : '—';

      return `<details class="history-item">
        <summary>
          <span>${sess.label}</span>
          <span class="h-meta">${dt} · ${players.length} jogador(es) · <span class="history-total">${Math.round(total)} pts</span></span>
        </summary>
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>Nick</th><th>Classe</th><th>Arena</th><th>Formato</th>
              <th class="num">Marcas</th><th class="num">Oc. S</th><th class="num">Oc. A</th><th class="num">Oc. B</th>
              <th class="num">Monst.</th><th class="num">Chefe</th>
              <th class="num">Abates</th><th class="num">Assist.</th><th class="num">Mortes</th><th class="num">Pontos</th>
            </tr></thead>
            <tbody>${renderSessionRows(players)}</tbody>
          </table>
        </div>
      </details>`;
    }).join('');
  }

  (async ()=>{
    const { data: { session } } = await client.auth.getSession();
    if(!session){
      gateMsg.textContent = 'Você precisa entrar pra acessar essa página.';
      setTimeout(()=>{ window.location.href = 'index.html'; }, 1200);
      return;
    }

    const { data: profile, error } = await client
      .from('profiles')
      .select('approved, staff, removed')
      .eq('id', session.user.id)
      .single();

    if(error || !profile || profile.removed){
      gateMsg.textContent = 'Sua conta não tem acesso a essa página.';
      await client.auth.signOut();
      return;
    }
    if(!profile.approved){
      gateMsg.textContent = 'Seu cadastro ainda está aguardando aprovação da staff.';
      await client.auth.signOut();
      return;
    }

    renderTopNav(client, profile, 'historico');
    gate.style.display = 'none';
    app.style.display = 'block';
    loadHistory();
  })();
</script>
</body>
</html>
